<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Valencia &rarr; Santa Marta &middot; Gu&iacute;as de viaje</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">
<style>
:root{
  --paper:#FAF8F4; --surface:#FFFFFF; --surface-2:#F3F0E9;
  --ink:#141D24; --ink-2:#5C6871; --ink-3:#8A939A;
  --line:#E3DFD6; --line-strong:#CFC9BC;
  --accent:#0D5A61; --accent-soft:#E2EEEE;
  --shadow:0 1px 2px rgba(20,29,36,.05), 0 8px 24px -16px rgba(20,29,36,.22);
}
@media (prefers-color-scheme: dark){
  :root{
    --paper:#0E141A; --surface:#161E25; --surface-2:#1D272F;
    --ink:#E9EBE6; --ink-2:#A0ABB3; --ink-3:#7A858D;
    --line:#27333B; --line-strong:#3A4750;
    --accent:#54B3B8; --accent-soft:#15302F;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -16px rgba(0,0,0,.8);
  }
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--paper);color:var(--ink);
  font-family:"Source Serif 4",Georgia,serif;font-size:16px;line-height:1.62;
  -webkit-font-smoothing:antialiased;
}

/* ---------- Hub ---------- */
#hub{min-height:100%;display:flex;align-items:center;justify-content:center;padding:40px 20px}
.hub-inner{width:100%;max-width:720px}
.eyebrow{
  font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:11px;font-weight:600;
  letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3);margin:0 0 14px
}
h1{
  font-family:Archivo,system-ui,sans-serif;font-weight:700;
  font-size:clamp(28px,5.4vw,42px);line-height:1.14;letter-spacing:-.02em;margin:0 0 10px
}
.sub{color:var(--ink-2);margin:0 0 34px;font-size:16px;max-width:52ch}
.cards{display:grid;gap:14px}
@media(min-width:720px){.cards{grid-template-columns:1fr 1fr;gap:16px}}
.card{
  display:block;text-align:left;width:100%;cursor:pointer;
  background:var(--surface);border:1px solid var(--line);border-radius:14px;
  padding:22px 22px 20px;color:inherit;font:inherit;
  box-shadow:var(--shadow);transition:border-color .16s ease, transform .16s ease;
}
.card:hover{border-color:var(--accent);transform:translateY(-2px)}
.card:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.card-tag{
  font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:10.5px;font-weight:600;
  letter-spacing:.14em;text-transform:uppercase;color:var(--accent);
  background:var(--accent-soft);border-radius:999px;padding:4px 9px;display:inline-block;margin-bottom:12px
}
.card h2{font-family:Archivo,system-ui,sans-serif;font-size:20px;font-weight:600;letter-spacing:-.01em;margin:0 0 6px}
.card p{margin:0 0 14px;color:var(--ink-2);font-size:14.5px;line-height:1.5}
.route{
  font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:12px;font-weight:600;
  color:var(--ink-3);letter-spacing:.06em;border-top:1px solid var(--line);padding-top:12px;
  display:flex;justify-content:space-between;align-items:center;gap:10px
}
.arrow{color:var(--accent);font-family:Archivo,system-ui,sans-serif;font-size:16px}
.foot{margin-top:30px;color:var(--ink-3);font-size:13px;font-family:"IBM Plex Mono",ui-monospace,monospace;letter-spacing:.03em}

/* ---------- Viewer ---------- */
#viewer{display:none;height:100%;flex-direction:column}
.bar{
  flex:0 0 auto;display:flex;align-items:center;gap:12px;
  padding:9px 14px;background:var(--surface);border-bottom:1px solid var(--line)
}
.back{
  display:inline-flex;align-items:center;gap:7px;cursor:pointer;
  font-family:Archivo,system-ui,sans-serif;font-size:13.5px;font-weight:600;
  color:var(--ink);background:var(--surface-2);border:1px solid var(--line);
  border-radius:999px;padding:7px 14px;transition:border-color .16s ease
}
.back:hover{border-color:var(--accent);color:var(--accent)}
.back:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.bar-title{
  font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:11.5px;font-weight:600;
  letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap
}
#frame{flex:1 1 auto;width:100%;border:0;display:block;background:var(--paper)}
</style>
</head>
<body>

<main id="hub">
  <div class="hub-inner">
    <p class="eyebrow">Avianca &middot; Septiembre 2026</p>
    <h1>Valencia &rarr; Santa Marta</h1>
    <p class="sub">Dos gu&iacute;as de viaje, una para cada itinerario. Elige la tuya.</p>

    <div class="cards">
      <button class="card" data-view="grupo">
        <span class="card-tag">7 viajeros</span>
        <h2>Grupo principal</h2>
        <p>Ida el domingo, septiembre 6. Regreso el s&aacute;bado 12, con llegada a Valencia el domingo 13. Tres reservas.</p>
        <div class="route"><span>VLN &rarr; BOG &rarr; SMR</span><span class="arrow">&rarr;</span></div>
      </button>

      <button class="card" data-view="jonathan">
        <span class="card-tag">1 viajero</span>
        <h2>Jonathan</h2>
        <p>Ida el jueves, septiembre 10. Regreso el s&aacute;bado 12, con llegada a Valencia el domingo 13. Viaja solo a la ida y vuelve con la familia.</p>
        <div class="route"><span>VLN &rarr; BOG &rarr; SMR</span><span class="arrow">&rarr;</span></div>
      </button>
    </div>

    <p class="foot">Conexi&oacute;n en Bogot&aacute; &middot; Guarda esta p&aacute;gina en tu tel&eacute;fono</p>
  </div>
</main>

<div id="viewer">
  <div class="bar">
    <button class="back" id="backBtn"><span aria-hidden="true">&larr;</span> Inicio</button>
    <span class="bar-title" id="barTitle"></span>
  </div>
  <iframe id="frame" title="Guia de viaje"></iframe>
</div>

<script>
(function(){
  var VIEWS = {
    grupo:    { el:'doc-grupo',    label:'Grupo principal \u00b7 7 viajeros', title:'Grupo principal (7) \u00b7 Valencia \u2192 Santa Marta' },
    jonathan: { el:'doc-jonathan', label:'Jonathan \u00b7 1 viajero',         title:'Jonathan \u00b7 Valencia \u2192 Santa Marta' }
  };
  var HOME_TITLE = 'Valencia \u2192 Santa Marta \u00b7 Gu\u00edas de viaje';

  var hub = document.getElementById('hub');
  var viewer = document.getElementById('viewer');
  var frame = document.getElementById('frame');
  var barTitle = document.getElementById('barTitle');
  var cache = {};
  var current = null;

  function decode(id){
    if(cache[id]) return cache[id];
    var raw = document.getElementById(id).textContent.replace(/\s+/g,'');
    var bin = atob(raw);
    var bytes = new Uint8Array(bin.length);
    for(var i=0;i<bin.length;i++) bytes[i] = bin.charCodeAt(i);
    cache[id] = new TextDecoder('utf-8').decode(bytes);
    return cache[id];
  }

  function render(){
    var key = (location.hash || '').replace(/^#\/?/,'');
    var v = VIEWS[key];
    if(!v){
      viewer.style.display = 'none';
      hub.style.display = 'flex';
      frame.removeAttribute('srcdoc');
      document.title = HOME_TITLE;
      current = null;
      return;
    }
    if(current !== key){
      frame.srcdoc = decode(v.el);
      current = key;
    }
    barTitle.textContent = v.label;
    document.title = v.title;
    hub.style.display = 'none';
    viewer.style.display = 'flex';
    window.scrollTo(0,0);
  }

  document.querySelectorAll('.card').forEach(function(btn){
    btn.addEventListener('click', function(){ location.hash = '#' + btn.dataset.view; });
  });
  document.getElementById('backBtn').addEventListener('click', function(){
    if(location.hash) location.hash = '';
  });
  window.addEventListener('hashchange', render);
  render();
})();
</script>
